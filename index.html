    <script>
      // Gracefully silence disabled HMR WebSocket transport in sandboxed iframe environment
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (typeof OrigWebSocket === 'function') {
          var WrappedWebSocket = function(url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1));
            if (isViteHmr) {
              return {
                url: String(url || ''),
                protocol: typeof protocols === 'string' ? protocols : '',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                readyState: 0,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                send: function() {},
                close: function() { this.readyState = 3; }
              };
            }
            return arguments.length > 1
              ? new OrigWebSocket(url, protocols)
              : new OrigWebSocket(url);
          };
          WrappedWebSocket.prototype = OrigWebSocket.prototype;
          WrappedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          WrappedWebSocket.OPEN = OrigWebSocket.OPEN;
          WrappedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          WrappedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = WrappedWebSocket;
        }
        var origError = console.error;
        var origWarn = console.warn;
        function isViteHmrLog(args) {
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            var text = '';
            if (typeof a === 'string') {
              text = a;
            } else if (a && typeof a === 'object') {
              text = (a.message || '') + ' ' + (a.stack || '') + ' ' + String(a);
            } else {
              text = String(a || '');
            }
            if (
              text.indexOf('WebSocket') !== -1 ||
              text.indexOf('[vite]') !== -1 ||
              text.indexOf('@vite/client') !== -1 ||
              text.indexOf('createWebSocketModuleRunnerTransport') !== -1
            ) {
              return true;
            }
          }
          return false;
        }
        console.error = function() {
          if (isViteHmrLog(arguments)) return;
          origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteHmrLog(arguments)) return;
          origWarn.apply(console, arguments);
        };
      })();
      window.addEventListener('error', function (e) {
        var msg = e && e.message ? String(e.message) : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        var msg = reason && reason.message ? String(reason.message) : String(reason || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      try {
        var savedTheme = localStorage.getItem('fuglor_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (err) {}
    </script>
  </head>
